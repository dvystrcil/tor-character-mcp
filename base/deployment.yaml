# tor-character-mcp Deployment.
#
# Single-replica Go MCP server. Stateless — cultural tables are baked
# into the binary at compile time, no DB, no volumes.
#
# Health endpoint at /healthz (separate from the MCP streamable handler
# at /mcp). Same probe pattern as rpg-dice-mcp.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tor-character-mcp
  namespace: tor-character-mcp
  labels:
    app.kubernetes.io/name: tor-character-mcp
    app.kubernetes.io/part-of: homelab-mcp
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: tor-character-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tor-character-mcp
        app.kubernetes.io/part-of: homelab-mcp
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: tor-character-mcp-harbor-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: tor-character-mcp
          image: harbor.sirddail.net/ai/tor-character-mcp:dev
          imagePullPolicy: Always
          args:
            - --http=:8080
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          # D-012 (VPA epic homelab#455): requests right-sized from the
          # Off-mode VPA's measured target. See notes in the PR body.
          resources:
            requests:
              cpu: 25m
              memory: 250Mi
            limits:
              cpu: 200m
              memory: 320Mi
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
